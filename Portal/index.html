        body {
            min-height: 100vh;
            background: #eceef1;

            color: #000;
        }

        .container {
            width: 100%;
            max-width: 680px;
            margin: auto;
            padding: 45px 24px 35px;
        }

        /* PERFIL */

        .profile {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 30px;
        }

        .profile img {
            width: 112px;
            height: 112px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 18px;
        }

        .profile h1 {
            font-size: 19px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .profile p {
            font-size: 14px;
            color: #555;
        }

        /* REDES SOCIALES */

        .social-links {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            margin-top: 24px;
        }

        .social-links a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            color: #111;
            text-decoration: none;
            transition: transform 0.2s;
        }

        .social-links a:hover {
            transform: scale(1.15);
        }

        .social-links svg {
            width: 25px;
            height: 25px;
            fill: currentColor;
        }

        /* BOTONES */

        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-card {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 66px;
            padding: 15px 45px;
            background: #fff;
            border-radius: 13px;
            color: #111;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.04);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .link-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(0,0,0,0.09);
        }

        .link-card:active {
            transform: scale(0.98);
        }

        /* PIE DE PÁGINA */

        footer {
            margin-top: 35px;
            text-align: center;
        }

        footer .social-links {
            margin-top: 0;
        }

        .footer-text {
            margin-top: 20px;
            color: #777;
            font-size: 12px;
        }

        /* RESPONSIVE */

        @media (max-width: 480px) {
            .container {
                padding: 35px 18px 25px;
            }

            .profile img {
                width: 100px;
                height: 100px;
            }
